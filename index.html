<style>
:root {
  --p-bg: #edccbe; --p-surface: #e8c2b2; --p-ink: #351a2b; --p-muted: #6c4857;
  --p-accent: #351a2b; --p-accent-ink: #edccbe; --p-action: #351a2b; --p-action-ink: #edccbe;
  --p-inv-bg: #351a2b; --p-inv-surface: #402534; --p-inv-ink: #edccbe; --p-inv-muted: #b2938f;
  --p-inv-accent: #edccbe; --p-inv-accent-ink: #351a2b; --p-inv-action: #edccbe; --p-inv-action-ink: #351a2b;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-text: "Libre Franklin", system-ui, sans-serif;
  --display-weight: 400;
  --display-tracking: -0.02em;
  --display-tracking-xl: -0.026em;
}
/* one-screen page: the research line and the small links under the buttons */
/* no top bar: the page starts at the hero */
:root { --nav: 0px; }
.hero__research { margin-top: var(--s-7); max-width: none; font-size: 18px; line-height: 1.65; }
.hero__research .t-label { display: block; margin-bottom: var(--s-3); color: var(--p-muted); }
.hero__links { display: flex; flex-wrap: wrap; gap: var(--s-5); margin-top: var(--s-6); font-size: var(--t-small); }
.hero__links a { color: var(--p-ink); }
/* desktop: the words centred beside the photo */
@media (min-width: 1024px) { .hero--split .hero__text { align-self: center; } }
/* phone: the four links as a tidy 2x2 grid */
@media (max-width: 639px) { .hero__links { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2) var(--s-5); } .hero__links a { justify-self: start; } }
/* tablet and phone: no headshot, the words alone */
@media (max-width: 1023px) {
  .hero--split .hero__media { display: none !important; }
}
</style>
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>

<main id="top">

        <h1 id="hero-h">Christine Ballisty</h1>
        <p class="hero__lead">Using the humanities to bridge people, technology, and execution in organizations.</p>
        <p class="hero__research"><span class="t-label">Research interest</span>How everyday work decides whose judgment gets trusted, and what organizations lose when the answer depends on who&rsquo;s talking.</p>
        <div class="btn-row"><a class="btn btn--primary" href="mailto:christine@ballisty.com">Email Christine<svg class="m-arrow" viewBox="0 0 12 12" aria-hidden="true"><path class="m-arrow__stem" d="M1 6h8"/><path class="m-arrow__head" d="M4.5 2.5 8 6l-3.5 3.5"/></svg></a></div>
        <p class="hero__links"><!-- placeholders: swap "#" for cv.pdf (academic) and resume.pdf (work) once the files exist --><a class="link" href="#">CV</a><a class="link" href="#">Resume</a><a class="link" href="https://www.linkedin.com/in/christineballisty">LinkedIn</a><a class="link" href="https://itskristamarie.substack.com">Substack</a></p>
      </div>
      <div class="hero__media span-6 start-7">
        <img src="assets/img/headshot.webp" alt="Christine Ballisty in sunglasses under pink bougainvillea" style="--ly-pos: 50% 40%" fetchpriority="high" data-source="client" data-subject="headshot">
      </div>
    </div></div>
  </section>
</main>
